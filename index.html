<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoo Chat - Coming Soon</title>
  <meta name="description" content="Zoo Chat - AI-powered chat interface">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --brand: #10b981; --bg-primary: #0a0a0a; --text-primary: #fafafa; --text-secondary: #a3a3a3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 40px; max-width: 600px; }
    .logo { font-size: 3rem; margin-bottom: 24px; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 16px; }
    p { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 32px; }
    .btn { display: inline-block; background: var(--brand); color: white; padding: 12px 32px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🦁</div>
    <h1>Zoo Chat</h1>
    <p>AI-powered chat interface coming soon. In the meantime, explore the Zoo ecosystem.</p>
    <a href="https://zoo.ngo" class="btn">Visit Zoo</a>
  </div>
</body>
</html>
